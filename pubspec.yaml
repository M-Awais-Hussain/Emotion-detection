name: emotioneye
description: "Detect, understand, and improve your emotional well-being"
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter
  url_launcher: ^6.2.5
  confetti: ^0.7.0
  camera: ^0.10.6
  image: ^4.5.4
  onnxruntime: ^1.4.1
  lottie: ^3.1.2
  emailjs: ^4.0.0
  image_picker: ^1.1.2
  http: ^1.2.2
  cupertino_icons: ^1.0.6
  path_provider: ^2.1.5
  share_plus: ^7.0.0
  shared_preferences: ^2.2.2
  intl: 0.20.2
  awesome_notifications: ^0.10.1
  permission_handler: ^12.0.3
  google_mlkit_face_detection: ^0.13.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  fl_chart: ^1.2.0
  uuid: ^4.5.3
 


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
#  hive_generator: ^2.0.1
#  build_runner: ^2.4.7

flutter:
  uses-material-design: true
  assets:
    - assets/emotion_model.onnx
    - assets/labels.txt
    - assets/animation.json
    - assets/portrait.png

    - assets/exercises/happy/setu_bandhasana.png
    - assets/exercises/happy/suryanamaskar.png
    - assets/exercises/happy/ustrasana.png
    - assets/exercises/happy/virabhadrasana.png
    - assets/exercises/happy/vrikshasana.png

    - assets/exercises/angry/balasana.png
    - assets/exercises/angry/marjaryasana_bitilasana.png
    - assets/exercises/angry/nadi_shodhana.png
    - assets/exercises/angry/uttanasana.png
    - assets/exercises/angry/viparita_karani.png

    - assets/exercises/sad/matsyasana.png
    - assets/exercises/sad/paschimottanasana.png
    - assets/exercises/sad/supta_baddha_konasana.png
    - assets/exercises/sad/ustrasana.png
    - assets/exercises/sad/viparita_karani.png

    - assets/exercises/neutral/ardha_chandrasana.png
    - assets/exercises/neutral/marjaryasana_bitilasana.png
    - assets/exercises/neutral/meditation.png
    - assets/exercises/neutral/sukhasana.png
